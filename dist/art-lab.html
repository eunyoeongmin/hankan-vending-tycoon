let last=0;document.addEventListener('visibilitychange',()=>{last=0;});function frame(now){const dt=last?Math.min(.05,(now-last)/1000):0;last=now;if(!document.hidden)tick(dt);paint();requestAnimationFrame(frame);}ui();scale();paint();requestAnimationFrame(frame);
window.artLab={state:()=>({stock,warehouse,sales,paused,action,elapsed,phase}),palette:PAL,sprites:SPRITES};
